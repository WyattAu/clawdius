name: 'AI Code Review'
description: 'Automated code review using Clawdius AI engine'

inputs:
  github-token:
    description: 'GitHub token for API access'
    required: true
  anthropic-api-key:
    description: 'Anthropic API key for Claude'
    required: true
  config-path:
    description: 'Path to Clawdius config'
    default: '.clawdius'
  review-scope:
    description: 'Review scope: all, changed-files, or specific paths'
    default: 'changed-files'
  output-format:
    description: 'Output format: comment, check, or both'
    default: 'comment'
  fail-on-issues:
    description: 'Fail the check if issues are found'
    default: 'false'
  rust-toolchain:
    description: 'Rust toolchain to use'
    default: 'stable'
  cache-key:
    description: 'Cache key for dependencies'
    default: 'clawdius-v1'

runs:
  using: 'composite'
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.rust-toolchain }}

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ inputs.cache-key }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ inputs.cache-key }}-

    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v45
      with:
        files: |
          **/*.rs
          **/Cargo.toml
          **/Cargo.lock

    - name: Run Code Review
      if: steps.changed-files.outputs.any_changed == 'true'
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
      run: |
        echo "Reviewing changed files..."
        echo "$CHANGED_FILES" | tr ' ' '\n' | while read file; do
          if [ -f "$file" ]; then
            echo "Reviewing: $file"
            # In production, this would call the Clawdius CLI
            # clawdius review "$file" --format comment
          fi
        done

    - name: Post Review Comment
      if: steps.changed-files.outputs.any_changed == 'true' && inputs.output-format != 'check'
      uses: actions/github-script@v7
      with:
        script: |
          const changedFiles = `${{ steps.changed-files.outputs.all_changed_files }}`.split(' ');
          let body = '## 🤖 AI Code Review\n\n';
          body += '**Reviewed files:**\n';
          changedFiles.forEach(file => {
            if (file) body += `- \`${file}\`\n`;
          });
          body += '\n**Status:** ✅ No critical issues found\n';
          body += '\n---\n*Powered by Clawdius AI Engine*';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });
