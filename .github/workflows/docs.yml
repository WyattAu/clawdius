name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/book/**'
      - 'index.html'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.4.40'

      - name: Build book
        run: |
          cd docs/book
          mdbook build

      - name: Merge landing page with docs
        run: |
          mkdir -p site
          # Copy docs book content first
          cp -r docs/book/book/* site/
          # Landing page overwrites the docs index.html -- users land on the marketing page
          # Docs are accessible via nav links or /intro.html
          cp index.html site/index.html
          echo "clawdius.co.uk" > site/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
