# Weekly vet-imports refresh bot — template.
#
# Install in each kit repo as .github/workflows/vet-refresh.yml:
#   cp templates/vet-refresh.yml <repo>/.github/workflows/vet-refresh.yml
#
# Why: Dependabot bumps versions weekly (templates/dependabot.yml), but the
# committed supply-chain/imports.lock is only regenerated by hand. Stale
# imports turned a 12-repo Dependabot wave red (the vet job's --locked check
# fails once imports.lock no longer matches Cargo.lock). This bot closes the
# gap: after each wave it runs `cargo vet regenerate imports` and opens one
# PR with the diff.
#
# Scheduling: Dependabot's weekly wave lands on Mondays
# (templates/dependabot.yml: schedule.day: monday), so this runs Tuesday
# morning UTC — after the wave, before most human commits.
#
# Loop-safety: this workflow triggers ONLY on schedule/workflow_dispatch, so
# the bot PR (a pull_request event) does not re-trigger it. The PR does run
# the repo's normal CI including the rust-kit.yml vet gate — which is exactly
# the point: the gate passes because the imports are fresh again.

name: vet-refresh

on:
  schedule:
    - cron: '0 4 * * 2' # Tuesdays 04:00 UTC, after the Monday Dependabot wave
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: vet-refresh
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  refresh-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # taiki-e install-action serves v0.10.0, which cannot parse imports.lock
      # entries for crates published via crates.io trusted publishing. Install
      # from crates.io; 0.10.2 matches the shared vet gate (rust-kit.yml).
      - name: Install cargo-vet
        run: cargo install --locked cargo-vet --version 0.10.2

      - name: Regenerate imports
        run: cargo vet regenerate imports

      - name: Detect supply-chain drift
        id: drift
        run: |
          if git diff --exit-code supply-chain/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "imports.lock already up to date — no PR needed"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat supply-chain/
          fi

      - name: Create refresh PR
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: vet/refresh-imports
          title: "vet: refresh imports"
          commit-message: "vet: regenerate imports"
          labels: dependencies
          body: |
            ## What

            `cargo vet regenerate imports` output, produced automatically by
            the weekly `vet-refresh` bot.

            ## Why

            The Dependabot wave (weekly, Mondays) bumps `Cargo.lock`, but the
            committed `supply-chain/imports.lock` is only regenerated by hand.
            Stale imports make the shared vet gate (`cargo vet --locked`,
            rust-kit.yml) fail CI repo-wide. This PR re-syncs imports so the
            gate stays green.

            ## Checklist

            - [ ] CI green (the `vet` job is the real check)
            - [ ] No unexpected audit-scope changes in `imports.lock`
                  (peer-audit imports only; human audits in `audits.toml`
                  are never touched by `regenerate imports`)
