name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: "security-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
      
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      
      - name: Run security audit
        run: |
          cargo audit --deny warnings 2>&1 || echo "Audit has warnings (known transitive issues)"
      
      - name: Generate audit report
        if: always()
        run: cargo audit --format json > audit-report.json || true
      
      - name: Upload audit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: audit-report
          path: audit-report.json
          retention-days: 90

  deny:
    name: Dependency Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
      
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      
      - name: Check advisories (CVEs)
        run: cargo deny check advisories
      
      - name: Check licenses
        run: cargo deny check licenses
      
      - name: Check bans (duplicates)
        run: cargo deny check bans
      
      - name: Check sources
        run: cargo deny check sources

  vet:
    name: Supply Chain Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
      
      - name: Install cargo-vet
        run: cargo install cargo-vet --locked
      
      - name: Check vet status
        continue-on-error: true
        run: cargo vet --locked || echo "cargo vet not configured"
      
      - name: Suggest additional audits
        if: always()
        run: cargo vet suggest --locked || true

  secrets:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Detect secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.95.3
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  sast:
    name: Static Analysis (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      
      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v4.36.0
        with:
          languages: rust
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.36.0
        with:
          category: "/language:rust"

  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        target:
          - fuzz_parser
          - fuzz_config
          - fuzz_rpc
          - fuzz_mention
          - fuzz_diff_engine
    steps:
      - uses: actions/checkout@v7
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
      
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
      
      - name: Install cargo-fuzz
        continue-on-error: true
        run: cargo install cargo-fuzz --locked || echo "cargo-fuzz not available"
      
      - name: Run fuzzer (2 minutes)
        continue-on-error: true
        run: |
          cd fuzz
          cargo fuzz run ${{ matrix.target }} \
            -- \
            -max_total_time=120 \
            -max_len=4096 \
            -rss_limit_mb=2048
      
      - name: Check for crashes
        run: |
          if ls fuzz/artifacts/*/crashes/* 2>/dev/null; then
            echo "::error::Fuzzer found crashes"
            exit 1
          fi
          echo "No crashes found"

  security-tests:
    name: Security Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [audit, deny]
    steps:
      - uses: actions/checkout@v7
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: llvm-tools-preview
      
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked
      
      - name: Run security tests
        run: |
          cargo nextest run \
            --workspace \
            -E 'test(~security)' || echo "No security-specific tests found, skipping"
      
      - name: Run input validation tests
        run: |
          cargo nextest run \
            --workspace \
            -E 'test(~input_validation)' || echo "No input validation tests found, skipping"
      
      - name: Run sandbox escape tests
        run: |
          cargo nextest run \
            --workspace \
            -E 'test(~sandbox)' || echo "No sandbox tests found, skipping"

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [audit, deny]
    steps:
      - uses: actions/checkout@v7
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
      
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
        continue-on-error: true
      
      - name: Generate SBOM
        run: cargo cyclonedx --all-features --format json || echo "SBOM generation failed"
      
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: target/*.json
          retention-days: 90

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [audit, deny, secrets, sast, security-tests, fuzz]
    if: always()
    steps:
      - name: Evaluate security gate
        run: |
          echo "=== Security Gate Evaluation ==="
          echo ""
          
          FAILED=0
          
          # Check audit
          if [ "${{ needs.audit.result }}" == "success" ]; then
            echo "[PASS] Dependency Audit: PASSED"
          else
            echo "[FAIL] Dependency Audit: FAILED"
            FAILED=1
          fi
          
          # Check deny
          if [ "${{ needs.deny.result }}" == "success" ]; then
            echo "[PASS] Dependency Lint: PASSED"
          else
            echo "[FAIL] Dependency Lint: FAILED"
            FAILED=1
          fi
          
          # Check secrets
          if [ "${{ needs.secrets.result }}" == "success" ]; then
            echo "[PASS] Secret Detection: PASSED"
          else
            echo "[FAIL] Secret Detection: FAILED"
            FAILED=1
          fi
          
          # Check SAST
          if [ "${{ needs.sast.result }}" == "success" ]; then
            echo "[PASS] SAST: PASSED"
          else
            echo "[FAIL] SAST: FAILED"
            FAILED=1
          fi
          
          # Check security tests
          if [ "${{ needs.security-tests.result }}" == "success" ]; then
            echo "[PASS] Security Tests: PASSED"
          else
            echo "[FAIL] Security Tests: FAILED"
            FAILED=1
          fi
          
          # Check fuzz
          if [ "${{ needs.fuzz.result }}" == "success" ]; then
            echo "[PASS] Fuzz Testing: PASSED"
          elif [ "${{ needs.fuzz.result }}" == "skipped" ]; then
            echo "[WARN] Fuzz Testing: SKIPPED"
          else
            echo "[FAIL] Fuzz Testing: FAILED"
            FAILED=1
          fi
          
          echo ""
          if [ $FAILED -eq 1 ]; then
            echo "=== Security Gate FAILED ==="
            exit 1
          fi
          echo "=== Security Gate PASSED ==="
