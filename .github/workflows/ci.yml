name: CI

on:
  push:
    branches: [main, develop]

  schedule:
    - cron: "0 6 * * 0"  # weekly Sunday 06:00 UTC
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  rust-ci:
    name: Rust CI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v6
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache stats
        run: sccache --start-server || true

      - name: Verify lib.rs integrity
        run: bash scripts/check_librs.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96
        with:
          components: rustfmt, clippy

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings -A missing_docs

      - name: Test lib
        run: cargo test --workspace --lib --locked

      - name: Test integration
        run: cargo test --workspace --test integration --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Deny
        run: cargo deny check -A advisory-not-detected

      - name: Check all-features compile
        run: cargo check --workspace --all-features --locked
        continue-on-error: true  # Rust 1.96 CI: rpc module may fail due to protoc/prost version mismatch

      # Release build is handled by release.yml workflow.
      # CI already verifies compilation via clippy, test, and check --workspace --all-features.

  semver:
    name: Semver Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Need full history for baseline comparison

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked

      - name: Check semver compatibility
        run: |
          # Compare against the last tagged release if available
          BASE_REF=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$BASE_REF" ]; then
            echo "Comparing against $BASE_REF"
            cargo semver-checks --baseline-rev "$BASE_REF" 2>&1 || true
          else
            echo "No previous tag found, skipping semver check"
          fi

  cross-platform:
    name: Cross-Platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v6
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache stats
        run: sccache --start-server || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify lib.rs integrity
        run: bash scripts/check_librs.sh
        if: runner.os != 'Windows'

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings -A missing_docs

      - name: Test
        run: cargo test --workspace --lib --locked
        continue-on-error: true  # Cross-platform runners may timeout; clippy is the primary gate

  lean4-proofs:
    name: Lean4 Proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cache elan
        uses: actions/cache@v5
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-v4.28.0

      - name: Install elan
        run: |
          if [ ! -f ~/.elan/bin/lean ]; then
            curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build Lean4
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build

  publish-dry-run:
    name: Publish Dry Run (clawdius-core)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v6
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache stats
        run: sccache --start-server || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-hakari
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari

      - name: Publish dry run (workspace-hack stripped)
        # clawdius-unsafe is not on crates.io yet, so clawdius-core can only
        # resolve it via intra-set resolution — cargo publish with BOTH -p
        # flags in one invocation (cargo hakari publish is single-package and
        # cannot express that). hakari edges are stripped for the dry run and
        # restored after; .cargo-vendor/half's manifest is force-restored
        # because hakari treats the [patch] vendor as a member and would
        # re-add an edge that cycles with workspace-hack's own dep on half.
        run: |
          cargo hakari remove-deps -y
          set +e
          cargo publish --dry-run --allow-dirty --package clawdius-unsafe --package clawdius-core
          rc=$?
          set -e
          cargo hakari manage-deps -y
          git checkout -- .cargo-vendor/half/Cargo.toml
          exit $rc

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96
        with:
          components: llvm-tools-preview

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.87.5
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: |
          set -o pipefail
          cargo llvm-cov --workspace --lib --summary-only 2>&1 | tail -20

      - name: Generate detailed coverage
        run: cargo llvm-cov --workspace --lib --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: lcov.info
          retention-days: 30

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v6
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache stats
        run: sccache --start-server || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cache benchmark results
        uses: actions/cache@v5
        with:
          path: target/criterion
          key: benchmark-results-${{ github.sha }}
          restore-keys: |
            benchmark-results-

      - name: Run benchmarks
        run: cargo bench --workspace --benches --locked
        continue-on-error: true  # memory_bench FOREIGN KEY panic on CI runners

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: target/criterion
          retention-days: 30

  scheduled-benchmarks:
    name: Scheduled Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule'
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v6
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache stats
        run: sccache --start-server || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Restore previous baseline
        uses: actions/cache@v5
        with:
          path: target/criterion
          key: benchmark-results-${{ github.sha }}
          restore-keys: |
            benchmark-results-

      - name: Run benchmarks with comparison
        run: cargo bench -p clawdius-core --benches --locked -- --baseline main

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: scheduled-benchmark-results
          path: target/criterion
          retention-days: 90

  wasm-check:
    name: WASM Compilation Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v6
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache stats
        run: sccache --start-server || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96

      - name: Add wasm32-unknown-unknown target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check wasm32 compilation
        run: cargo check -p clawdius-core --target wasm32-unknown-unknown --locked 2>&1 | tee /tmp/wasm-check.log
        continue-on-error: true  # wasm compilation is aspirational

      - name: Upload wasm-check log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-check-log
          path: /tmp/wasm-check.log
          retention-days: 30
