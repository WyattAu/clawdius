name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run clippy (code warnings only)
        run: |
          cargo clippy --workspace -- -W clippy::all 2>&1 | \
            grep "warning:" | grep -v "generated\|multiple versions\|build failed" | \
            tee /tmp/clippy.txt
          if [ -s /tmp/clippy.txt ]; then
            echo "::error::Clippy found code quality warnings"
            cat /tmp/clippy.txt
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --lib
      - run: cargo test --workspace --doc

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit
      - name: Check for vulnerabilities
        run: |
          cargo audit 2>&1 | tee /tmp/audit.txt
          if grep -q "^error:" /tmp/audit.txt; then
            echo "::error::Security vulnerabilities found"
            exit 1
          fi

  features:
    name: Feature Flags
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - default
          - keyring
          - crash-reporting
          - browser
          - embeddings
          - local-llm
          - vector-db
          - orchestrator
          - redis-queue
          - postgres
          - mariadb
          - stripe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check -p clawdius-core --features ${{ matrix.feature }}

  build-release:
    name: Release Build
    runs-on: ubuntu-latest
    needs: [check, clippy, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p clawdius -p clawdius-gateway
      - name: Report binary sizes
        run: |
          echo "clawdius: $(du -h target/release/clawdius | cut -f1)"
          echo "clawdius-gateway: $(du -h target/release/clawdius-gateway | cut -f1)"
      - name: Smoke test CLI commands
        run: |
          ./target/release/clawdius --version
          ./target/release/clawdius --help
          ./target/release/clawdius chat --help
          ./target/release/clawdius sprint --help
          ./target/release/clawdius watch --help
          ./target/release/clawdius analyze --help
          ./target/release/clawdius-gateway --help
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: target/release/clawdius,target/release/clawdius-gateway
