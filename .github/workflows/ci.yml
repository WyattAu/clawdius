name: CI

on:
  push:
    branches: [main, develop]

  schedule:
    - cron: "0 6 * * 0"  # weekly Sunday 06:00 UTC
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-ci:
    name: Rust CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify lib.rs integrity
        run: bash scripts/check_librs.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test lib
        run: cargo test --workspace --lib

      - name: Test integration
        run: cargo test --workspace --test integration

      - name: Deny
        run: cargo deny check bans licenses advisories

      - name: Check all-features compile
        run: cargo check --workspace --all-features
        continue-on-error: true  # Known issue: vector-db (IndexStats) and telegram (teloxide) fail

      - name: Build release
        run: cargo build --workspace --release

  cross-platform:
    name: Cross-Platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify lib.rs integrity
        run: bash scripts/check_librs.sh
        if: runner.os != 'Windows'

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --lib

  lean4-proofs:
    name: Lean4 Proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Lean
        uses: jaxx0/setup-lean@v1

      - name: Build Lean4
        run: lake build

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Cache benchmark results
        uses: actions/cache@v4
        with:
          path: target/criterion
          key: benchmark-results-${{ github.sha }}
          restore-keys: |
            benchmark-results-

      - name: Run benchmarks
        run: cargo bench --workspace -- --save-baseline main

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: target/criterion
          retention-days: 30

  scheduled-benchmarks:
    name: Scheduled Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Restore previous baseline
        uses: actions/cache@v4
        with:
          path: target/criterion
          key: benchmark-results-${{ github.sha }}
          restore-keys: |
            benchmark-results-

      - name: Run benchmarks with comparison
        run: cargo bench --workspace -- --baseline main

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-benchmark-results
          path: target/criterion
          retention-days: 90
