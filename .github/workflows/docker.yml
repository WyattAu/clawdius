name: Docker

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'Dockerfile'
      - 'Dockerfile.gateway'
      - 'docker-bake.hcl'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.target }})
    runs-on: ubuntu-latest
    # Dual-arch (amd64 + QEMU arm64) builds of this workspace routinely exceed
    # 45 min now that the prebuild genuinely compiles (it was soft-failed and
    # silently skipped for months).
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: clawdius
            dockerfile: Dockerfile
            image: clawdius
          - target: clawdius-gateway
            dockerfile: Dockerfile.gateway
            image: clawdius-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6.16.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            RUST_VERSION=1.96

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.8.2

      - name: Sign image with GitHub OIDC
        env:
          IMAGES: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # meta.outputs.tags is newline-separated; cosign takes exactly one
          # reference per invocation — sign every tag by digest.
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "$IMAGES"

      - name: Generate SBOM with syft
        uses: anchore/sbom-action@v0
        with:
          image: "${{ fromJSON(steps.meta.outputs.json).tags[0] }}@${{ steps.build.outputs.digest }}"
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attach SBOM to image
        env:
          IMAGES: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # The SBOM is attached to the image digest; one attachment covers
          # every tag pointing at that digest.
          # cosign >= 2.4 removed --sbom-type; the media type is detected
          # from the attached file.
          cosign attach sbom \
            --sbom sbom.spdx.json \
            "$(head -n1 <<< "$IMAGES")@${DIGEST}"
