name: Docker

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'Dockerfile'
      - 'Dockerfile.gateway'
      - 'docker-bake.hcl'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: clawdius
            dockerfile: Dockerfile
            image: clawdius
          - target: clawdius-gateway
            dockerfile: Dockerfile.gateway
            image: clawdius-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@ea165f8d65b634e114876b0b

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb4685
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c6544
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645ea
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            RUST_VERSION=1.92
