name: Docker

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'Dockerfile'
      - 'Dockerfile.gateway'
      - 'docker-bake.hcl'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: clawdius
            dockerfile: Dockerfile
            image: clawdius
          - target: clawdius-gateway
            dockerfile: Dockerfile.gateway
            image: clawdius-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6.16.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            RUST_VERSION=1.92

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.8.2

      - name: Sign image with GitHub OIDC
        run: |
          cosign sign --yes \
            "${{ steps.meta.outputs.tags }}"@"${{ steps.build.outputs.digest }}"

      - name: Generate SBOM with syft
        uses: anchore/sbom-action@v0
        with:
          image: "${{ steps.meta.outputs.tags }}@${{ steps.build.outputs.digest }}"
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attach SBOM to image
        run: |
          cosign attach sbom --sbom-type spdxjson \
            --sbom sbom.spdx.json \
            "${{ steps.meta.outputs.tags }}"@"${{ steps.build.outputs.digest }}"
