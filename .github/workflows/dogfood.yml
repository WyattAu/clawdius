# Dogfood CI: clawdius works a real repository end-to-end.
#
# The runner clones this repo, seeds a known-broken test inside a scratch
# crate, and hands the repair to the clawdius agent (chat + tool loop:
# read/grep/edit/shell). Migration-gate evidence for the agent surface:
# if the agent cannot fix a one-function defect in a real repo layout,
# the tool surface is not done. Bounded: 25-minute job cap, one repo.
#
# Provider key comes from secrets. Use a METERED PAY-AS-YOU-GO API key
# (DEEPSEEK_API_KEY, or a standard Z.AI/Open.bigmodel API key) — CI usage
# via an unsupported third-party tool violates the GLM Coding Plan
# subscription terms (see docs.z.ai/legal-agreement/subscription-terms:
# plan quota is limited to officially supported tools; SDK access from
# your own applications is grounds for suspension/ban). Without a secret
# the job exits 0 with a skip notice so the gate stays green.

name: Dogfood

on:
  workflow_dispatch:
  schedule:
    # Daily 08:00 UTC — just after the Pacific-midnight free-tier quota
    # reset (~07:34), so a fresh 20-request budget is available per run.
    - cron: "0 8 * * *"

concurrency:
  group: dogfood
  cancel-in-progress: false

jobs:
  sprint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Pick provider key
        id: key
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZAI_KEY: ${{ secrets.ZAI_API_KEY }}
          GOOGLE_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          # Use a METERED key (see comment above). For GOOGLE_API_KEY:
          # free tier is accepted for PUBLIC-repo dogfood (the tool and its
          # target code are open source; Google's free-tier product-
          # improvement/human-review pipeline is harmless on public code).
          # ATTACH BILLING (Paid Service) before pointing the agent at
          # private repos — free-tier prompts are human-reviewable.
          if [ -n "$DEEPSEEK_KEY" ]; then
            echo "provider=deepseek" >> "$GITHUB_OUTPUT"
            echo "key=$DEEPSEEK_KEY" >> "$GITHUB_OUTPUT"
            echo "env=DEEPSEEK_API_KEY" >> "$GITHUB_OUTPUT"
          elif [ -n "$GOOGLE_KEY" ]; then
            echo "provider=google" >> "$GITHUB_OUTPUT"
            echo "key=$GOOGLE_KEY" >> "$GITHUB_OUTPUT"
            echo "env=GOOGLE_API_KEY" >> "$GITHUB_OUTPUT"
          elif [ -n "$ZAI_KEY" ]; then
            echo "provider=zai" >> "$GITHUB_OUTPUT"
            echo "key=$ZAI_KEY" >> "$GITHUB_OUTPUT"
            echo "env=ZAI_API_KEY" >> "$GITHUB_OUTPUT"
          else
            echo "provider=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip when no provider key
        if: steps.key.outputs.provider == 'none'
        run: |
          echo "::notice::No DEEPSEEK_API_KEY/ZAI_API_KEY secret; dogfood run skipped."
          exit 0

      - name: Build clawdius
        if: steps.key.outputs.provider != 'none'
        run: cargo build --release -p clawdius

      - name: Seed a real repo with a known defect
        if: steps.key.outputs.provider != 'none'
        run: |
          mkdir -p /home/runner/dogfood/src
          cd /home/runner/dogfood
          git init -q .
          cat > Cargo.toml <<'EOF'
          [package]
          name = "dogfood-scratch"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          EOF
          cat > src/lib.rs <<'EOF'
          /// Adds two numbers. The `-` below is the seeded defect: the
          /// crate compiles, cargo test fails on the assertion, and the
          /// agent must find and fix it.
          pub fn add(a: i64, b: i64) -> i64 {
              a - b
          }

          #[cfg(test)]
          mod tests {
              use super::add;
              #[test]
              fn adds() {
                  assert_eq!(add(2, 3), 5);
              }
          }
          EOF
          git add -A
          git -c user.email=dogfood@clawdius.dev -c user.name=dogfood commit -qm "seed: broken add()"
          SEED_SHA=$(git rev-parse HEAD)
          echo "SEED_SHA=$SEED_SHA" >> "$GITHUB_ENV"
          # Baseline: the seeded test must fail before the agent runs.
          cargo test 2>&1 | tee /tmp/baseline.txt
          grep -q "test result: FAILED" /tmp/baseline.txt

      - name: Run the clawdius agent on it
        if: steps.key.outputs.provider != 'none'
        env:
          PROVIDER: ${{ steps.key.outputs.provider }}
          KEY_VALUE: ${{ steps.key.outputs.key }}
          KEY_ENV: ${{ steps.key.outputs.env }}
        run: |
          set -o pipefail
          export "$KEY_ENV=$KEY_VALUE"
          cd /home/runner/dogfood
          # Provider capacity 503s come in minute-scale windows; the retry
          # wrapper survives short ones, this loop survives long ones.
          for attempt in 1 2 3; do
            echo "Agent attempt $attempt of 3"
            if timeout 900 "$GITHUB_WORKSPACE/target/release/clawdius" auto \
              --provider "$PROVIDER" \
              --model gemini-flash-lite-latest \
              --max-iterations 15 \
              --fail-on-test-failure \
              "IMPORTANT: You MUST use your tools to make changes. Never merely \
               describe a fix — apply it. In this repository, cargo test fails. \
               1. Use the shell tool to run 'cargo test' and see the failure. \
               2. Use the read_file tool to read the failing source file. \
               3. Use the edit_file tool to fix the defect. \
               4. Use the shell tool to run 'cargo test' again and confirm it passes. \
               Change as little as possible." \
              2>&1 | tee /tmp/agent.txt; then
              break
            fi
            echo "Agent attempt failed; sleeping 60s before retry..."
            sleep 60
          done

      - name: Verify the fix
        if: steps.key.outputs.provider != 'none'
        run: |
          cd /home/runner/dogfood
          cargo test 2>&1 | tee /tmp/after.txt
          grep -q "test result: ok" /tmp/after.txt || {
            echo "::error::Agent did not produce a passing test suite."
            exit 1
          }
          git diff --stat HEAD
          # Working tree vs seed commit: covers fixes the agent committed
          # AND fixes left uncommitted.
          git diff --name-only "$SEED_SHA" | grep -q "src/lib.rs" || {
            echo "::error::Agent ran but did not modify the defective file."
            exit 1
          }
          echo "::notice::Dogfood PASS: agent repaired the repo end-to-end."
