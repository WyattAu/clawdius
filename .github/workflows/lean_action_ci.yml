name: Lean Action CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@ea165f8d65b634e114876b0b

      - name: Cache elan
        uses: actions/cache@0057852bfaa8
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-v4.28.0

      - name: Install elan
        run: |
          if [ ! -f ~/.elan/bin/lean ]; then
            curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build Lean4 proofs
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build
