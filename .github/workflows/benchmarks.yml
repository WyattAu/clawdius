name: Benchmarks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: "bench-${{ github.ref }}"
  cancel-in-progress: true

# Performance SLOs (enforced via criterion baseline comparison):
#   - Ring buffer ops: <100ns
#   - Wallet guard: <100us
#   - HFT pipeline: <1ms
#   - Messaging routing: <1ms P99
#   - Regression threshold: >15% slowdown fails CI on PRs

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@ea165f8d65b634e114876b0b
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b5826f8eb73f

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@e18b497796c1
        with:
          key: bench

      - name: Cache criterion data
        uses: actions/cache@0057852bfaa8
        with:
          path: target/criterion
          key: ${{ runner.os }}-criterion-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-criterion-main
            ${{ runner.os }}-criterion-

      - name: Run benchmarks (criterion crates with baseline)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # clawdius-core uses criterion: pass --save-baseline
          cargo bench -p clawdius-core --benches --locked -- --save-baseline main || true
          # clawdius CLI uses custom harness: no criterion flags
          cargo bench -p clawdius --benches --locked || true

      - name: Run benchmarks (no baseline)
        if: "!(github.event_name == 'push' && github.ref == 'refs/heads/main')"
        run: cargo bench --workspace --benches --locked

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6
        with:
          name: benchmark-results-${{ github.sha }}
          path: target/criterion
          retention-days: 30

  regression-check:
    name: Regression Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: benchmark
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@ea165f8d65b634e114876b0b
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b5826f8eb73f

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@e18b497796c1
        with:
          key: bench-regression

      - name: Cache criterion data
        uses: actions/cache@0057852bfaa8
        with:
          path: target/criterion
          key: ${{ runner.os }}-criterion-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-criterion-main
            ${{ runner.os }}-criterion-

      - name: Download benchmark results from benchmark job
        uses: actions/download-artifact@d3f86a106a0b
        with:
          name: benchmark-results-${{ github.sha }}
          path: target/criterion

      - name: Fetch main branch for baseline comparison
        run: git fetch origin main

      - name: Run regression comparison
        id: regression
        run: |
          REGRESSION_OUTPUT=$(mktemp)
          # Only clawdius-core supports criterion --baseline flag
          if cargo bench -p clawdius-core --benches --locked -- --baseline main 2>&1 | tee "$REGRESSION_OUTPUT"; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
            echo "No performance regression detected"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "Performance regression detected!"
            exit 1
          fi

      - name: Extract regression summary
        if: always()
        id: summary
        run: |
          {
            echo "body<<COMMENT_EOF"
            echo "## Benchmark Results"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo "**Branch:** \`${{ github.head_ref }}\` -> \`${{ github.base_ref }}\`"
            echo "**Status:** ${{ steps.regression.outputs.result == 'pass' && '✅ Passed' || '❌ Regression detected' }}"
            echo ""
            echo "Regression threshold: **>15%** slowdown"
            echo ""
            echo "Benchmarks compared against \`main\` branch baseline using criterion."
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: always()
        uses: actions/github-script@f28e40c7f34b
        with:
          script: |
            const body = `${{ steps.summary.outputs.body }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
