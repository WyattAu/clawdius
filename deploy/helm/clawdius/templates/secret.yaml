apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clawdius.fullname" . }}
  labels:
    {{- include "clawdius.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: "{{ .Values.secrets.anthropicApiKey }}"
  {{- end }}
  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: "{{ .Values.secrets.openaiApiKey }}"
  {{- end }}
  {{- if .Values.secrets.openrouterApiKey }}
  OPENROUTER_API_KEY: "{{ .Values.secrets.openrouterApiKey }}"
  {{- end }}
  {{- if .Values.secrets.zaiApiKey }}
  ZAI_API_KEY: "{{ .Values.secrets.zaiApiKey }}"
  {{- end }}
  # Platform secrets (override ConfigMap values if set)
  {{- if .Values.platforms.teams.enabled }}
  TEAMS_APP_PASSWORD: "{{ .Values.platforms.teams.appPassword }}"
  {{- end }}
  {{- if .Values.platforms.whatsapp.enabled }}
  WHATSAPP_ACCESS_TOKEN: "{{ .Values.platforms.whatsapp.accessToken }}"
  WHATSAPP_VERIFY_TOKEN: "{{ .Values.platforms.whatsapp.verifyToken }}"
  {{- end }}
  {{- if .Values.platforms.rocketchat.enabled }}
  ROCKETCHAT_TOKEN: "{{ .Values.platforms.rocketchat.token }}"
  {{- end }}
