# Clawdius Monorepo Workspace
# 
# This workspace contains all crates for the Clawdius ecosystem:
# - clawdius: CLI tool (standalone)
# - clawdius-code: VSCode extension helper binary
# - clawdius-core: Shared library (LLM, sessions, tools, etc.)

[workspace]
resolver = "2"
members = [
    "crates/clawdius",
    "crates/clawdius-core",
    "crates/clawdius-gateway",
    "crates/clawdius-code",
    "crates/clawdius-mcp",
    "crates/clawdius-plugin-sdk",
    "crates/clawdius-lsp",
    "crates/clawdius-ui",
    "crates/clawdius-tauri",
    "crates/clawdius-web",
    "crates/clawdius-auth",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Clawdius Team <team@clawdius.dev>"]
license = "Apache-2.0"
repository = "https://github.com/WyattAu/clawdius"
homepage = "https://clawdius.dev"
documentation = "https://clawdius.co.uk"
rust-version = "1.96"
keywords = ["ai", "llm", "coding-assistant", "agent", "sandbox"]
categories = ["development-tools", "command-line-utilities", "api-bindings"]
readme = "README.md"

[workspace.dependencies]
# === Async Runtime ===
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "process", "io-util", "signal"] }

# === Serialization ===
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0"

# === CLI ===
clap = { version = "4", features = ["derive", "env", "string"] }
clap_complete = "4"

# === Database ===
rusqlite = { version = "0.40", features = ["bundled"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1"] }
deadpool-postgres = "0.14"
mysql_async = { version = "0.35", default-features = false, features = ["default-rustls"] }

# === LLM Integration ===
genai = "0.6"
# Fix RUSTSEC-2026-0037 (HIGH - CVSS 8.7) - quinn-proto via reqwest/genai chain
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
# Note: lancedb's object_store vulnerability needs upstream lancedb update

# === Code Analysis ===
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
syntect = "5.3"

# === Terminal UI ===
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

# === WASM Runtime (Brain Isolation) ===
wasmtime = "45"

# === JSON-RPC ===
jsonrpsee = { version = "0.24", features = ["server", "client", "ws-client"] }

# === Auth shared crates ===
salting = { path = "../salting" }
tokenkit = { path = "../tokenkit" }

# === Security ===
keyring = "4"
keyring-core = "1"
rpassword = "7.5"

# === HTTP ===
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }

# === Browser Automation ===
# NOTE: default-features = false is required to exclude async-std (RUSTSEC-2025-0052)
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime", "bytes"] }
# headless_chrome removed - chromiumoxide provides equivalent functionality without async-std

# === Utilities ===
uuid = { version = "1.21", features = ["v4", "serde"] }
which = "7.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
sha3 = "0.12"
blake3 = "1.5"
dotenvy = "0.15"
walkdir = "2.5"
chrono = { version = "0.4.39", features = ["serde"] }
base64 = "0.22"
hex = "0.4"
regex = "1.11"
aho-corasick = "1"
petgraph = "0.8"
glob = "0.3"
glob-match = "0.2"
ignore = "0.4"
notify = "8.0"
futures = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"
async-trait = "0.1"
# Fix RUSTSEC-2026-0002 (unsound IterMut) - upgrade to 0.16+
lru = "0.16"

# === Crypto (encryption at rest) ===
aes-gcm = "0.11.0-rc.4"
hmac = "0.13"
sha2 = "0.11"
hmac-sha256 = "1"
cryptkit = { path = "../cryptkit" }

# === Randomness ===
getrandom = "0.2"

# === URL Handling ===
url = "2.5"
urlencoding = "2.1"

# === WASM Runtime (additional crates) ===
wasmtime-wasi = "45"

# === Token Counting ===
tiktoken-rs = "0.5"

# === Diff ===
similar = "2.6"

# === Vector Database ===
# Upgraded to 0.27.x to fix RUSTSEC-2026-0044, RUSTSEC-2026-0048, RUSTSEC-2026-0049
lancedb = "0.27"
arrow = "57"
arrow-array = "57"
arrow-schema = "57"

# === ML/Embeddings ===
candle-core = "0.10"
candle-nn = "0.10"
candle-transformers = "0.10"
tokenizers = "0.15"
hf-hub = "0.5"

# === Testing ===
proptest = "1.6"
rstest = "0.25"
criterion = "0.5"
tempfile = "3.17"
mockall = "0.14"

# === System Information ===
sysinfo = "0.39"
parking_lot = "0.12"

# === High-Performance Allocator ===
mimalloc = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

# Workspace lints — single source of truth is .clippy.toml
# CI passes additional -D flags via CLI (see .github/workflows/ci.yml)
# This configures the baseline; CI is stricter for production checks.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# TODO: escalate to "warn" once production unwraps are eliminated (see VERSION.md)
# Current count: ~1,664 production unwraps across ~100 files.
# Track progress with: rg '\.unwrap\(\)' crates -g '*.rs' --files | grep -v tests
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
nursery = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"

[profile.release]
panic = "abort"
lto = "thin"
strip = "symbols"
opt-level = 3
codegen-units = 1
debug = false
debug-assertions = false
overflow-checks = false
rpath = false

[profile.dev]
panic = "abort"

[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 4

# PGO instrumented build (step 1 of PGO)
[profile.pgo-instrument]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# PGO optimized build (step 3 of PGO — uses profiling data)
[profile.pgo-optimized]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# Memory profiling with dhat
[profile.memprof]
inherits = "release"
opt-level = 2
debug = 1
lto = "off"
panic = "abort"

# No workspace features - each crate defines its own

# Transitive dependency duplicates (documented for reference):
# These are semver-incompatible versions pulled by different upstream crates.
# They cannot be unified without [patch] overrides, which would risk breaking
# upstream compatibility.
#
# - hashbrown 0.15/0.16/0.17 — wasmtime, indexmap
# - getrandom 0.3/0.4 — rand 0.9, wasmtime (our direct dep: 0.2)
# - reqwest 0.13 — genai 0.5 (our direct dep: 0.12)
# - rand 0.8/0.9 — proptest, criterion (different semver requirements)
# - thiserror 1.0 — jsonrpsee/witx (our direct dep: 2.0)
# - base64 0.21 — transitive (our direct dep: 0.22)
# - petgraph 0.6 — wasmtime (our direct dep: 0.7)
# - tower 0.4 — reqwest 0.12 (our direct dep: 0.5)
# - toml 0.9 — wasmtime (our direct dep: 1.0)
# - arrow-* — lancedb internal deps (our direct dep: 57)
# - itertools 0.10/0.11/0.14 — various upstream crates
# - bitflags 2.x — two identical versions from different feature sets
# - socket2 0.5/0.6 — tokio vs mio
# - rustix 0.38/1.x — tokio vs tempfile
# - event-listener 2.x/5.x — async-std vs async-channel

[patch.crates-io]
half = { path = ".cargo-vendor/half" }

# Contingency: if lancedb >= 0.28 is released, replace with:
# [patch.crates-io]
# lancedb = { git = "https://github.com/lancedb/lancedb", rev = "..." }
# Contingency: if matrix-sdk >= 0.11 is released, add:
# [patch.crates-io]
# matrix-sdk-base = { git = "https://github.com/matrix-org/matrix-rust-sdk", branch = "main" }

# Contingency: if wasmtime >= 45 is released, add:
# [patch.crates-io]
# wasmtime-wasi = { git = "https://github.com/bytecodealliance/wasmtime", rev = "..." }

# CVE Contingency: Uncomment when upstream publishes fixes
# RUSTSEC-2026-0049/0098/0099/0104 (rustls-webpki via lancedb)
# [patch.crates-io]
# rustls-webpki = { git = "https://github.com/rustls/rustls-webpki", rev = "..." }
#
# RUSTSEC-2025-0065/0135 (matrix-sdk-base)
# matrix-sdk-base = { git = "https://github.com/matrix-org/matrix-rust-sdk", tag = "v0.11.0" }
#
# RUSTSEC-2026-0149 (wasmtime)
# wasmtime = { git = "https://github.com/bytecodealliance/wasmtime", tag = "v45.0.0" }

