[package]
name = "clawdius-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/clawdius-core"
description = "Core library for Clawdius - High-assurance AI coding assistant with multi-tier sandboxing"
readme = "README.md"
keywords = ["ai", "llm", "coding-assistant", "sandbox", "formal-verification"]
categories = ["development-tools", "api-bindings", "asynchronous"]
exclude = [
    "/tests",
    "/examples",
    "/.github",
    "/fuzz",
    "*.log",
]

[lib]
name = "clawdius_core"
path = "src/lib.rs"

[dependencies]
# Async
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
async-stream.workspace = true
tokio-stream.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# Database
rusqlite.workspace = true
tokio-postgres = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }
mysql_async = { workspace = true, optional = true }

# LLM
reqwest.workspace = true
genai.workspace = true

# Code Analysis
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-python.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-go.workspace = true
tree-sitter-java.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-ruby.workspace = true
tree-sitter-php.workspace = true

# HTTP (REST API)
axum.workspace = true
tower.workspace = true
tower-http.workspace = true

# Utilities
uuid.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
blake3.workspace = true
sha3.workspace = true
chrono.workspace = true
regex.workspace = true
aho-corasick.workspace = true
petgraph.workspace = true
lru.workspace = true
url.workspace = true
which.workspace = true

# Token counting
tiktoken-rs.workspace = true

# Diff
tempfile.workspace = true
similar.workspace = true

# Encoding
base64.workspace = true
hex = { workspace = true }

# Vector Database (optional)
lancedb = { workspace = true, optional = true }
arrow = { workspace = true, optional = true }
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }

# ML/Embeddings (optional)
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }

# Keyring (optional)
keyring = { workspace = true, optional = true }

# Browser Automation (optional)
chromiumoxide = { workspace = true, optional = true }

# Crash Reporting (optional)
sentry = { version = "0.32", optional = true }

# File watching
notify.workspace = true
walkdir.workspace = true
glob-match.workspace = true

# URL encoding
urlencoding.workspace = true

# System information
sysinfo.workspace = true
parking_lot.workspace = true

# WASI Sandbox
wasmtime = { workspace = true }
wasmtime-wasi.workspace = true

# Encryption at rest
aes-gcm.workspace = true
hmac.workspace = true
sha2.workspace = true
getrandom.workspace = true

# Redis (optional, for orchestrator queue)
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"], optional = true }

# Stripe (optional, for billing)
stripe = { version = "1.0.0-rc.5", package = "async-stripe", optional = true, default-features = false, features = ["default-tls"] }

[dev-dependencies]
criterion = { workspace = true }
mockall.workspace = true
proptest.workspace = true
loom = "0.7"
wat = "1"

[[bench]]
name = "core_bench"
harness = false

[[bench]]
name = "llm_benchmark"
harness = false

[[bench]]
name = "tools_benchmark"
harness = false

[[bench]]
name = "session_benchmark"
harness = false

[[bench]]
name = "simd_bench"
harness = false

[[bench]]
name = "memory_bench"
harness = false

[[bench]]
name = "sandbox_bench"
harness = false

[features]
default = []
keyring = ["dep:keyring"]
crash-reporting = ["dep:sentry"]
browser = ["dep:chromiumoxide"]
embeddings = ["dep:tokenizers", "dep:hf-hub"]
local-llm = ["embeddings", "dep:candle-core", "dep:candle-nn", "dep:candle-transformers"]
vector-db = ["dep:lancedb", "dep:arrow", "dep:arrow-array", "dep:arrow-schema"]
orchestrator = []
redis-queue = ["orchestrator", "dep:redis"]
postgres = ["dep:tokio-postgres", "dep:deadpool-postgres"]
mariadb = ["dep:mysql_async"]
stripe = ["dep:stripe"]
# Billing subsystem (billing + usage + invoice)
billing = []
# Infrastructure modules (zero-cost, no optional deps)
audit = []
compliance = []
i18n = []
onboarding = []
proof = []
rpc = []
webhooks = []
airgap = []
watch = []

[lints]
workspace = true
