[package]
name = "clawdius-code"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/clawdius-code"
description = "Clawdius Code - VSCode extension helper binary"
readme = "README.md"
keywords = ["ai", "llm", "coding-assistant", "vscode", "editor"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "clawdius-code"
path = "src/main.rs"

[dependencies]
clawdius-core = { path = "../clawdius-core", version = "1.0.0-rc.1" }

# CLI
clap.workspace = true

# Async
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "io-util", "process"] }

# JSON-RPC
jsonrpsee.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Utilities
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
uuid.workspace = true

# Allocator
mimalloc = { workspace = true, optional = true }

[features]
default = ["mimalloc"]

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
