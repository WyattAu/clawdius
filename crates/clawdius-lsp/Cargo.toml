[package]
name = "clawdius-lsp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/clawdius-lsp"
description = "Clawdius LSP server - Language Server Protocol integration with Graph-RAG"
readme = "README.md"
keywords = ["lsp", "language-server", "ai", "coding-assistant", "tree-sitter"]
categories = ["development-tools", "text-editors"]

[[bin]]
name = "clawdius-lsp"
path = "src/main.rs"

[dependencies]
clawdius-core = { path = "../clawdius-core", version = "1.0.0" }

# LSP protocol
tower-lsp = "0.20"

# Async
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "io-util"] }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Utilities
anyhow.workspace = true

[lints]
workspace = true
