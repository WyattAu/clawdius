[package]
name = "clawdius-metrics"
version = "0.1.0"
edition = "2021"
description = "Prometheus-compatible metrics seam for Clawdius — re-expressed over the estate's metrics-kit registry"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
# Estate-internal metrics engine (lock-free atomics, cardinality guard,
# spec-correct Prometheus text exposition).
metrics-kit.workspace = true

# NOTE: version requirement required for publish; clawdius-metrics must be
# published to crates.io before clawdius-core (see release.yml ordering).
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
