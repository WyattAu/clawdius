[package]
name = "clawdius-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Clawdius desktop application built with Tauri v2"

[dependencies]
clawdius-core = { path = "../clawdius-core", version = "1.0" }
clawdius-ui = { path = "../clawdius-ui", version = "1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
leptos = { version = "0.8", features = ["csr"] }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-plugin-shell", "dep:tauri-plugin-dialog", "dep:tauri-plugin-clipboard-manager"]

[lints]
workspace = true
