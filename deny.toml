[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "OFL-1.1",
    "OpenSSL",
    "0BSD",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# workspace-hack (cargo-hakari output) re-exports `half` — a locally-patched
# copy vendored at .cargo-vendor/half and pinned via [patch.crates-io]
# (Cargo.toml) — as a versionless path dependency (hakari never emits version
# reqs for path deps), which the wildcard lint flags. The crate is
# `publish = false`, so the path pin fully determines the version (2.7.1) and
# nothing wildcard-shaped can reach crates.io; allow-wildcard-paths is the
# upstream-sanctioned exemption for exactly this private-crate case.
# Tracking: SECURITY.md; re-evaluate when the vendored copy is dropped
# (lancedb >= 0.28 contingency in Cargo.toml).
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = [
    { name = "winnow", version = "0.7" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
