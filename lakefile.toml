name = "clawdius"
version = "0.1.0"
defaultTargets = [
  "ProofAgentLoop", "ProofConcurrentExecution", "ProofCarryingEdits",
  "ProofRepoMapScoring", "ProofSanitizerSoundness", "ProofSecurityPolicy",
  "ProofTokenBudgetScan", "ProofVfsSafety",
  "ProofAudit", "ProofCapability", "ProofContainer", "ProofFsm",
  "ProofHost", "ProofRingBuffer", "ProofSandbox",
  "ProofSandboxExtended", "ProofRpc", "ProofRingBufferExtended", "ProofCache",
]

[[lean_lib]]
name = "Clawdius"

[[lean_lib]]
name = "ProofAgentLoop"
srcDir = ".specs/02_architecture/proofs"
