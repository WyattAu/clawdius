# Clawdius Security Audit Configuration
#
# This file configures `cargo audit` and dependency scanning.
# Run: cargo audit --config .cargo-audit.toml

[advisories]
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
notice = "warn"

[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
]

[network]
deny = [
    "code duplication",
    "unknown crates",
]
